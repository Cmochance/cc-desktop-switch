name: Release

# v2 Tauri 2 release pipeline:
# - 触发方式:
#     - tag 推 v<x.y.z> 自动跑(无 dry-run)
#     - `gh workflow run release.yml -f version=<x.y.z>` 手动跑(prepare job 自动建 tag)
#     - `gh workflow run release.yml -f version=<x.y.z> -f dry_run=true` 只 build 不发 release
# - 4 platform: macOS arm64 / macOS Intel / Windows x64 / Linux x86_64
# - 全部走 `cargo tauri build`(无 Python / 无 PowerShell shim)
# - 产物前缀 `CC-Desktop-Switch-v<v>-<platform>.<ext>`(forward-looking 命名,
#   旧 codex-app-transfer 前缀历史 release 见 docs/CHANGELOG.md)
# - 默认创建 **draft release**(全局规则: release 默认 draft,等用户确认转 Latest)
# - 跳过 RSA signing + xtask release-bundle: Phase 2 cc-desktop-switch 自己 release key
#   就绪后启用,见 docs/refactor/codex-app-transfer-id-cleanup.md
# - 跳过 Authenticode codesign:secrets 未配置,Windows Defender 弹"未知发布者"
#   提示属预期,用户用 .sha256 校验

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 2.2.0"
        required: true
      dry_run:
        description: "Build and verify assets without creating a tag or publishing a release"
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          dry_run="${{ github.event.inputs.dry_run || 'false' }}"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          if [[ "$dry_run" == "true" ]]; then
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release tag (manual run only)
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.dry_run != 'true'
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          target_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$target_sha" ]]; then
              echo "Tag $tag points to $tag_sha, but this workflow is building $target_sha." >&2
              echo "Run the workflow from the tagged commit or choose a new version." >&2
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  build_macos_arm64:
    name: Build macOS arm64
    runs-on: macos-14
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时 cache ~/.cargo/bin 让 tauri-cli 跨 run 复用
          workspaces: ". -> target"
          cache-all-crates: true
      - name: Install Tauri CLI
        # CI runners 没预装 cargo-tauri,而本仓 Makefile / release pipeline 全部
        # 调 `cargo tauri build`。Swatinem/rust-cache `cache-all-crates: true`
        # 会 cache ~/.cargo/bin,首次跑 ~3-5 min,后续 run 命中缓存秒过。
        # `--force` 避免"already installed"非零退出(版本一致时也强制重跑,no-op)。
        run: cargo install tauri-cli --version "^2" --locked --force

      - name: Build (dmg + app)
        env:
          CARGO_TARGET_DIR: target
        run: cargo tauri build --bundles app,dmg --target aarch64-apple-darwin

      - name: Stage + rename macOS artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-staging
          dmg_src="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/CC Desktop Switch_${VERSION}_aarch64.dmg"
          dmg_dst="release-staging/CC-Desktop-Switch-v${VERSION}-macOS-arm64.dmg"
          cp "$dmg_src" "$dmg_dst"
          shasum -a 256 "$dmg_dst" | awk '{print $1}' > "$dmg_dst.sha256"
          hdiutil verify "$dmg_dst"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_macos_intel:
    name: Build macOS x64
    runs-on: macos-15-intel
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时 cache ~/.cargo/bin 让 tauri-cli 跨 run 复用
          workspaces: ". -> target"
          cache-all-crates: true
      - name: Install Tauri CLI
        # CI runners 没预装 cargo-tauri,而本仓 Makefile / release pipeline 全部
        # 调 `cargo tauri build`。Swatinem/rust-cache `cache-all-crates: true`
        # 会 cache ~/.cargo/bin,首次跑 ~3-5 min,后续 run 命中缓存秒过。
        # `--force` 避免"already installed"非零退出(版本一致时也强制重跑,no-op)。
        run: cargo install tauri-cli --version "^2" --locked --force

      - name: Build (dmg + app)
        env:
          CARGO_TARGET_DIR: target
        run: cargo tauri build --bundles app,dmg --target x86_64-apple-darwin

      - name: Stage + rename macOS Intel artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-staging
          dmg_src="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/CC Desktop Switch_${VERSION}_x64.dmg"
          dmg_dst="release-staging/CC-Desktop-Switch-v${VERSION}-macOS-x64.dmg"
          cp "$dmg_src" "$dmg_dst"
          shasum -a 256 "$dmg_dst" | awk '{print $1}' > "$dmg_dst.sha256"
          hdiutil verify "$dmg_dst"

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时 cache ~/.cargo/bin 让 tauri-cli 跨 run 复用
          workspaces: ". -> target"
          cache-all-crates: true
      - name: Install Tauri CLI
        # CI runners 没预装 cargo-tauri,而本仓 Makefile / release pipeline 全部
        # 调 `cargo tauri build`。Swatinem/rust-cache `cache-all-crates: true`
        # 会 cache ~/.cargo/bin,首次跑 ~3-5 min,后续 run 命中缓存秒过。
        # `--force` 避免"already installed"非零退出(版本一致时也强制重跑,no-op)。
        run: cargo install tauri-cli --version "^2" --locked --force

      - name: Build (nsis + msi)
        env:
          CARGO_TARGET_DIR: target
        run: cargo tauri build --bundles nsis,msi

      - name: Stage + rename Windows artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release-staging | Out-Null

          # Tauri default: src-tauri/target/release/bundle/nsis/CC Desktop Switch_<v>_x64-setup.exe
          $nsisSrc = "src-tauri/target/release/bundle/nsis/CC Desktop Switch_${env:VERSION}_x64-setup.exe"
          $nsisDst = "release-staging/CC-Desktop-Switch-v${env:VERSION}-Windows-x64-Setup.exe"
          Copy-Item -LiteralPath $nsisSrc -Destination $nsisDst
          Get-FileHash -Algorithm SHA256 -LiteralPath $nsisDst | ForEach-Object { $_.Hash.ToLower() } | Out-File -Encoding ascii "$nsisDst.sha256"

          # Tauri default: src-tauri/target/release/bundle/msi/CC Desktop Switch_<v>_x64_en-US.msi
          $msiSrc = "src-tauri/target/release/bundle/msi/CC Desktop Switch_${env:VERSION}_x64_en-US.msi"
          $msiDst = "release-staging/CC-Desktop-Switch-v${env:VERSION}-Windows-x64.msi"
          Copy-Item -LiteralPath $msiSrc -Destination $msiDst
          Get-FileHash -Algorithm SHA256 -LiteralPath $msiDst | ForEach-Object { $_.Hash.ToLower() } | Out-File -Encoding ascii "$msiDst.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时 cache ~/.cargo/bin 让 tauri-cli 跨 run 复用
          workspaces: ". -> target"
          cache-all-crates: true
      - name: Install Tauri CLI
        # CI runners 没预装 cargo-tauri,而本仓 Makefile / release pipeline 全部
        # 调 `cargo tauri build`。Swatinem/rust-cache `cache-all-crates: true`
        # 会 cache ~/.cargo/bin,首次跑 ~3-5 min,后续 run 命中缓存秒过。
        # `--force` 避免"already installed"非零退出(版本一致时也强制重跑,no-op)。
        run: cargo install tauri-cli --version "^2" --locked --force

      - name: Build (deb + appimage)
        env:
          CARGO_TARGET_DIR: target
        run: cargo tauri build --bundles deb,appimage

      - name: Stage + rename Linux artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-staging
          # Tauri default deb name: src-tauri/target/release/bundle/deb/CC Desktop Switch_<v>_amd64.deb
          deb_src="src-tauri/target/release/bundle/deb/CC Desktop Switch_${VERSION}_amd64.deb"
          deb_dst="release-staging/CC-Desktop-Switch-v${VERSION}-Linux-x86_64.deb"
          cp "$deb_src" "$deb_dst"
          sha256sum "$deb_dst" | awk '{print $1}' > "$deb_dst.sha256"

          appimg_src="src-tauri/target/release/bundle/appimage/CC Desktop Switch_${VERSION}_amd64.AppImage"
          appimg_dst="release-staging/CC-Desktop-Switch-v${VERSION}-Linux-x86_64.AppImage"
          cp "$appimg_src" "$appimg_dst"
          chmod +x "$appimg_dst"
          sha256sum "$appimg_dst" | awk '{print $1}' > "$appimg_dst.sha256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: [prepare, build_macos_arm64, build_macos_intel, build_windows, build_linux]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging
          pattern: release-*
          merge-multiple: true

      - name: Inspect collected assets
        run: |
          echo "=== release-staging/ ==="
          ls -la release-staging/
          echo ""
          echo "=== required asset count(本 release 至少要 6 个 + 6 个 sha256)==="
          find release-staging -maxdepth 1 -type f | wc -l

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          notes="CC Desktop Switch ${TAG}

          v2 Rust + Tauri 2 release。Phase 2(cc-desktop-switch 自己 release key
          + 内部 ID rename)就绪前,本版本暂不包含 RSA signing 与 latest.json
          自动更新清单 —— 请用同名 \`.sha256\` 文件校验下载完整性。

          各平台资产:
          - macOS Apple Silicon: \`CC-Desktop-Switch-v${VERSION}-macOS-arm64.dmg\`
          - macOS Intel x64:     \`CC-Desktop-Switch-v${VERSION}-macOS-x64.dmg\`
          - Windows x64 NSIS:    \`CC-Desktop-Switch-v${VERSION}-Windows-x64-Setup.exe\`
          - Windows x64 MSI:     \`CC-Desktop-Switch-v${VERSION}-Windows-x64.msi\`
          - Linux deb:           \`CC-Desktop-Switch-v${VERSION}-Linux-x86_64.deb\`
          - Linux AppImage:      \`CC-Desktop-Switch-v${VERSION}-Linux-x86_64.AppImage\`

          Windows 暂未做 Authenticode 代码签名,系统可能提示未知发布者;macOS
          未做开发者签名 + 公证,首次启动右键→打开。
          "
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CC Desktop Switch $TAG" \
              --notes "$notes" \
              --draft \
              --verify-tag
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CC Desktop Switch $TAG" \
              --notes "$notes" \
              --draft \
              --verify-tag
          fi

          assets=(release-staging/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Draft release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "请手动 review draft 内容 + 资产,确认无误后再 \`gh release edit ${TAG} --draft=false --latest\` 转 Latest。" >> "$GITHUB_STEP_SUMMARY"
